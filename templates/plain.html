<!-- desc: Looks like a normal typed email -- no card, no colour, no footer. Use when a branded template would feel too formal. -->
<div style="margin:0;padding:0;background:#ffffff;">
  <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;">{{ preheader }}</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td align="left" style="padding:16px 20px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
               style="max-width:600px;width:100%;">
          <tr>
            <td style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
              {{ body_html }}

              <p style="margin:20px 0 0 0;font-size:15px;line-height:1.6;color:#1f2937;">
                {{ brand_signoff }}
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</div>
